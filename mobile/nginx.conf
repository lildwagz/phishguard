# Web container: serves the Flutter web build and proxies the API on the same origin,
# so one public URL (Tailscale Funnel -> :8080) covers both. See plans/2026-11-12-deployment-tailscale-funnel.md.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Same limit as the API's MAX_BODY_BYTES (32 KB); rejected here before reaching the API.
    client_max_body_size 32k;

    location /v1/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    location = /health {
        proxy_pass http://api:8000;
        proxy_read_timeout 5s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
